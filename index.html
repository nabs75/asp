<!DOCTYPE html>
<html lang="fr" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>ASP - Aider Son Prochain (Gestion)</title>
    <style>
        :root {
            --primary-color: #D83A56; 
            --secondary-color: #FF5E62;
            --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fda085 100%);
        }

        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
        }

        /* --- LOGIN SCREEN --- */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg-gradient);
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 350px;
        }

        /* --- APP CONTENT --- */
        #app-content { display: none; padding: 20px; }

        .container {
            max-width: 600px;
            margin: 0 auto 30px auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 { color: var(--primary-color); text-align: center; margin-top: 0; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: #c22e48; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-bottom:20px;">Accès Privé ASP</h2>
            <input type="password" id="login-pass" placeholder="Mot de passe" style="margin-bottom:15px;">
            <button onclick="checkLogin()">Se connecter</button>
        </div>
    </div>

    <div id="app-content">
        
        <div class="container">
            <h2>📊 Comptabilité</h2>
            <form id="comptaForm">
                <div class="form-group">
                    <label>Type d'opération</label>
                    <select id="t-type">
                        <option value="income">✅ Recette (Entrée)</option>
                        <option value="expense">🔴 Dépense (Sortie)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Montant (€)</label>
                    <input type="number" id="t-amount" step="0.01" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label>Description / Motif</label>
                    <input type="text" id="t-desc" required placeholder="Ex: Course Carrefour">
                </div>

                <div class="form-group">
                    <label>Payeur / Bénéficiaire</label>
                    <input type="text" id="t-payer" required placeholder="Nom de la personne">
                </div>

                <div class="form-group">
                    <label>Mode de paiement</label>
                    <select id="t-payment">
                        <option value="Espèces">Espèces</option>
                        <option value="Virement">Virement</option>
                        <option value="CB">Carte Bancaire</option>
                        <option value="Chèque">Chèque</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Catégorie</label>
                    <input type="text" id="t-category" placeholder="Ex: Alimentaire, Maraude...">
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="t-date">
                </div>

                <div class="form-group">
                    <label>Justificatif (Optionnel)</label>
                    <input type="file" id="t-file" accept="image/*,application/pdf">
                </div>

                <button type="submit" id="btn-compta">Enregistrer & Envoyer SMS</button>
                <div id="status-compta" class="status-msg"></div>
            </form>
        </div>

        <div class="container">
            <h2>📄 Reçu Fiscal</h2>
            <form id="recuForm">
                <div class="form-group">
                    <label>Nom & Prénom du donateur</label>
                    <input type="text" id="r-nom" required>
                </div>
                <div class="form-group">
                    <label>Email du donateur</label>
                    <input type="email" id="r-email" required>
                </div>
                <div class="form-group">
                    <label>Montant du don (€)</label>
                    <input type="number" id="r-montant" required>
                </div>
                <button type="submit" id="btn-recu">Générer & Envoyer SMS</button>
                <div id="status-recu" class="status-msg"></div>
            </form>
        </div>

    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzdK8_eKyYWzu_yPlAIbmW4h66Ll59JCrq7eC-_cNwHxYowA15A6xGGriY83ajbLeqB/exec";
        const PASSWORD_HASH = "e22a387be8cee3abb4b3f4013fcc21b4c428a45cfac6ccc5f648adbb66b839f0";

        // --- SÉCURITÉ ---
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkLogin() {
            const pass = document.getElementById('login-pass').value;
            const hash = await sha256(pass);
            if (hash === PASSWORD_HASH) {
                localStorage.setItem('compta_token', hash);
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                document.getElementById('t-date').valueAsDate = new Date();
            } else {
                alert("Mot de passe incorrect");
            }
        }

        // --- ENVOI GÉNÉRIQUE ---
        async function envoyer(payload, btnId, statusId) {
            const btn = document.getElementById(btnId);
            const status = document.getElementById(statusId);
            
            btn.disabled = true;
            btn.innerText = "Traitement en cours...";
            status.style.display = "none";

            try {
                // Ajout automatique du token de sécurité
                payload.token = localStorage.getItem('compta_token');

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Pour éviter les erreurs CORS
                    body: JSON.stringify(payload)
                });

                status.style.display = "block";
                status.style.background = "#e8f5e9";
                status.style.color = "#2e7d32";
                status.textContent = "✅ Opération réussie ! SMS envoyé.";
                
                if(payload.type === "compta") document.getElementById('comptaForm').reset();
                if(payload.type === "recu_fiscal") document.getElementById('recuForm').reset();
                
            } catch (error) {
                status.style.display = "block";
                status.style.background = "#ffebee";
                status.style.color = "#c62828";
                status.textContent = "❌ Erreur de connexion.";
            } finally {
                btn.disabled = false;
                btn.innerText = (btnId === 'btn-compta') ? "Enregistrer & Envoyer SMS" : "Générer & Envoyer SMS";
            }
        }

        // --- LOGIQUE COMPTA ---
        document.getElementById('comptaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const payload = {
                type: "compta",
                actionType: document.getElementById('t-type').value,
                amount: document.getElementById('t-amount').value,
                desc: document.getElementById('t-desc').value,
                payer: document.getElementById('t-payer').value,
                payment: document.getElementById('t-payment').value,
                category: document.getElementById('t-category').value,
                date: document.getElementById('t-date').value,
                file: null
            };

            const fileInput = document.getElementById('t-file');
            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function() {
                    payload.file = {
                        name: fileInput.files[0].name,
                        type: fileInput.files[0].type,
                        base64: reader.result.split(',')[1]
                    };
                    envoyer(payload, 'btn-compta', 'status-compta');
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                envoyer(payload, 'btn-compta', 'status-compta');
            }
        });

        // --- LOGIQUE REÇU ---
        document.getElementById('recuForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const payload = {
                type: "recu_fiscal",
                nom: document.getElementById('r-nom').value,
                email: document.getElementById('r-email').value,
                montant: document.getElementById('r-montant').value,
                dateEmission: new Date().toLocaleDateString('fr-FR')
            };
            envoyer(payload, 'btn-recu', 'status-recu');
        });
    </script>
</body>
</html>
