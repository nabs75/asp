const CONTACT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0mLHxA8NRnQtaFAOivHz2DPqo-NZN7sV5LYRCmT_AvaYl68_kVSh7SjYBOU2BhysG/exec";
const GOOGLE_SCRIPT_URL  = "https://script.google.com/macros/s/AKfycbz1r5VAFH4gLyJbyh3rnzRNZ5qIoJEMYF5gmLaLRJJqhlgIwf7HNVotsQeTDANFNFZv/exec";

// Mot de passe local pour le bureau
const LOCAL_ACCESS_PASSWORD = 'kiwi@69200';

// Token de session envoyé dans apiSecret (doit matcher API_SECRET dans Apps Script)
let sessionApiSecret = null;

// =================== OUTILS ===================
function deriveTokenFromPassword(pass) {
    const salt = 'asp_compta_salt_v1';
    let str = pass + '::' + salt;
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
    }
    return 'F_' + Math.abs(hash).toString(16) + '_T';
}

function showToast(msg, type) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.style.borderLeft = type === 'error' ? '5px solid #e74c3c' : '5px solid #0F9D58';
    t.className = 'toast show';
    setTimeout(() => t.className = 'toast', 3000);
}

// =================== CAPTCHA + CONTACT ===================
let captchaResult = 0;

function generateCaptcha() {
    var operators = ['+', '-', '×'];
    var op = operators[Math.floor(Math.random() * operators.length)];
    var a, b, result;
    if (op === '+') {
        a = Math.floor(Math.random() * 10) + 1;
        b = Math.floor(Math.random() * 10) + 1;
        result = a + b;
    } else if (op === '-') {
        a = Math.floor(Math.random() * 10) + 5;
        b = Math.floor(Math.random() * 5) + 1;
        result = a - b;
    } else {
        a = Math.floor(Math.random() * 5) + 2;
        b = Math.floor(Math.random() * 5) + 2;
        result = a * b;
    }
    captchaResult = result;
    const q = document.getElementById('captcha-question');
    const aInput = document.getElementById('captcha-answer');
    if (q) q.textContent = a + ' ' + op + ' ' + b;
    if (aInput) {
        aInput.value = '';
        aInput.classList.remove('error');
    }
}

async function sendContact(event) {
    event.preventDefault();

    var userAnswer = parseInt(document.getElementById('captcha-answer').value);
    var captchaInput = document.getElementById('captcha-answer');
    if (isNaN(userAnswer) || userAnswer !== captchaResult) {
        captchaInput.classList.add('error');
        captchaInput.value = '';
        captchaInput.focus();
        showToast("❌ Réponse incorrecte, réessayez !", 'error');
        setTimeout(function() { generateCaptcha(); }, 1000);
        return;
    }

    const nom   = document.getElementById('contact-name').value;
    const email = document.getElementById('contact-email').value;
    const msg   = document.getElementById('contact-message').value;
    const btn   = document.getElementById('btn-contact');

    const payload = { type: 'contact', nom, email, message: msg };

    const originalText = btn.innerText;
    btn.innerText = "Envoi en cours...";
    btn.disabled = true;

    try {
        const response = await fetch(CONTACT_SCRIPT_URL + "?t=" + new Date().getTime(), {
            method: 'POST',
            redirect: 'follow',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.result === 'success') {
            showToast("Message envoyé !", 'success');
            document.getElementById('contactForm').reset();
            generateCaptcha();
            btn.innerText = "Message envoyé !";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.disabled  = false;
            }, 3000);
        } else {
            showToast("Erreur: " + result.error, 'error');
            btn.innerText = originalText;
            btn.disabled  = false;
        }
    } catch (err) {
        showToast("Erreur de connexion", 'error');
        console.error(err);
        btn.innerText = originalText;
        btn.disabled  = false;
    }
}

// =================== LOGIN / LOGOUT COMPTA ===================
function checkLogin() {
    const input    = document.getElementById('login-pass').value;
    const errorMsg = document.getElementById('login-error');

    if (input === LOCAL_ACCESS_PASSWORD) {
        sessionApiSecret = deriveTokenFromPassword(input); // => doit égal API_SECRET côté Apps Script

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-content').classList.remove('hidden');
        document.getElementById('app-content').style.display = 'block';
        document.querySelector('.container-public').style.display = 'none';
        localStorage.setItem('compta_auth', 'true');
        if (errorMsg) errorMsg.style.display = 'none';
    } else {
        if (errorMsg) errorMsg.style.display = 'block';
        document.getElementById('login-pass').value = '';
        document.getElementById('login-pass').focus();
    }
}

function logout() {
    sessionApiSecret = null;
    localStorage.removeItem('compta_auth');
    document.getElementById('app-content').style.display = 'none';
    document.getElementById('app-content').classList.add('hidden');
    document.getElementById('login-screen').style.display = 'none';
    document.querySelector('.container-public').style.display = 'flex';
}

document.getElementById('login-pass').addEventListener('keypress', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        checkLogin();
    }
});

const categories = {
    expense: ['Pôle social', 'Pôle médical'],
    income:  ['Cotisations', 'Subventions', 'Dons', 'Autres']
};
let currentType  = 'expense';
let selectedFile = null;
let sessionStats = { income: 0, expense: 0 };

document.addEventListener('DOMContentLoaded', () => {

function setType(type) {
    currentType = type;
    document.getElementById('t-type').value = type;

    const btnExp = document.getElementById('btn-expense');
    const btnInc = document.getElementById('btn-income');

    if (type === 'expense') {
        btnExp.classList.add('active');
        btnInc.classList.remove('active');
    } else {
        btnInc.classList.add('active');
        btnExp.classList.remove('active');
    }
    updateCategories();
}

function updateCategories() {
    const select = document.getElementById('t-category');
    if (!select) return;
    select.innerHTML = '';
    categories[currentType].forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
    });
}

function handleFileSelect(input) {
    if (input.files && input.files[0]) {
        selectedFile = input.files[0];
        document.getElementById('upload-text').style.display = 'none';
        const img = document.getElementById('file-preview');
        img.src = URL.createObjectURL(selectedFile);
        img.style.display = 'inline-block';
    }
}

function renderStats() {
    const inc = document.getElementById('stat-income');
    const exp = document.getElementById('stat-expense');
    if (inc) inc.textContent  = sessionStats.income.toFixed(2)  + ' €';
    if (exp) exp.textContent = sessionStats.expense.toFixed(2) + ' €';
}

const toBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload  = () => {
        const parts = reader.result.split(',');
        resolve({ data: parts[1], type: parts[0].match(/:(.*?);/)[1] });
    };
    reader.onerror = error => reject(error);
});

document.getElementById('comptaForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!sessionApiSecret) {
        showToast('Veuillez vous connecter avant d’envoyer une opération.', 'error');
        return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = 'Envoi...';

    const now = new Date();
    const idLisible = now.toLocaleDateString('fr-FR') + ' ' + now.toLocaleTimeString('fr-FR');

    const payload = {
        apiSecret: sessionApiSecret,
        id:        idLisible,
        type:      document.getElementById('t-type').value,
        desc:      document.getElementById('t-desc').value,
        payer:     document.getElementById('t-payer').value,
        payment:   document.getElementById('t-payment').value,
        amount:    document.getElementById('t-amount').value,
        category:  document.getElementById('t-category').value,
        date:      document.getElementById('t-date').value,
        file:      null
    };

    if (selectedFile) {
        try {
            payload.file = await toBase64(selectedFile);
        } catch (err) {
            showToast('Erreur lecture image', 'error');
            btn.disabled = false;
            btn.innerHTML = 'Réessayer';
            return;
        }
    }

    try {
        const response = await fetch(GOOGLE_SCRIPT_URL + "?t=" + new Date().getTime(), {
            method: 'POST',
            redirect: 'follow',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.result === 'success') {
            showToast('Envoyé !', 'success');
            document.getElementById('comptaForm').reset();
            const dateInput = document.getElementById('t-date');
            if (dateInput) dateInput.valueAsDate = new Date();
            setType('expense');
            document.getElementById('file-preview').style.display = 'none';
            document.getElementById('upload-text').style.display  = 'block';
            selectedFile = null;

            const val = parseFloat(payload.amount);
            if (payload.type === 'income') sessionStats.income  += val;
            else                           sessionStats.expense += val;
            renderStats();
        } else {
            showToast('Erreur: ' + result.error, 'error');
        }
    } catch (err) {
        showToast('Erreur de connexion', 'error');
        console.error(err);
    } finally {
        btn.disabled = false;
        btn.innerHTML = 'Envoyer';
    }
});

function genNumRecu() {
    var now = new Date();
    return 'ASP-' + now.getFullYear() + '-' +
           String(now.getMonth()+1).padStart(2,'0') + '-' +
           String(now.getDate()).padStart(2,'0') + '-' +
           String(now.getTime()).slice(-4);
}

function nombreEnLettres(n) {
    if (isNaN(n)) return '___';
    var unite   = ['', 'un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
    var dizaine = ['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
    function conv(nb) {
        if (nb === 0) return '';
        if (nb < 20) return unite[nb];
        if (nb < 100) {
            var d = Math.floor(nb/10), u = nb%10;
            if (d === 7 || d === 9) return dizaine[d] + (u === 1 && d === 7 ? '-et-' : '-') + unite[d===7||d===9 ? u+10 : u];
            return dizaine[d] + (u === 1 && d !== 8 ? '-et-un' : u ? '-'+unite[u] : (d===8?'s':''));
        }
        if (nb < 1000) return (nb===100?'cent':(conv(Math.floor(nb/100))+(Math.floor(nb/100)>1?'-cents':'-cent'))) + (nb%100 ? '-'+conv(nb%100) : '');
        if (nb < 10000) return conv(Math.floor(nb/1000)) + '-mille' + (nb%1000 ? '-'+conv(nb%1000) : '');
        return nb.toString();
    }
    var entier = Math.floor(n), cents = Math.round((n - entier)*100);
    var res = entier === 0 ? 'zéro' : conv(entier);
    if (cents > 0) res += ' virgule ' + conv(cents) + ' centime' + (cents > 1 ? 's' : '');
    return res.charAt(0).toUpperCase() + res.slice(1);
}
